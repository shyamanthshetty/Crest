services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: crest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: crestDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d crestDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crest-network

  # 2. Backend Server (Express + Prisma)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crest-backend
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
      DATABASE_URL: "postgresql://root:1234@db:5432/crestDB?schema=public"
      JWT_SECRET: "my_super_secret_jwt_key_change_this_later"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - crest-network

  # 3. Frontend Server (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crest-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: "http://localhost:8080/api"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - crest-network

volumes:
  postgres_data:

networks:
  crest-network:
    driver: bridge
